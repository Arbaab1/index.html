<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Foodies Park</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 10px 0 20px 0;
        }
        .header h1 {
            color: #d4af37;
            margin-bottom: 5px;
        }
        .back-btn {
            display: inline-block;
            color: #d4af37;
            text-decoration: none;
            border: 1px solid #d4af37;
            padding: 8px 16px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .gallery-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #222;
        }
    </style>
</head>
<body>

    <a href="./index.html" class="back-btn">← Back to Home</a>

    <div class="header">
        <h1>OUR GALLERY</h1>
        <p>Foodies Park, Darbhanga</p>
    </div>

    <div class="gallery-grid">
        <img src="./gallery-1.jpg" alt="Gallery 1">
        <img src="./gallery-2.jpg" alt="Gallery 2">
        <img src="./gallery-3.jpg" alt="Gallery 3">
        <img src="./gallery-4.jpg" alt="Gallery 4">
        <img src="./gallery-5.jpg" alt="Gallery 5">
        <img src="./gallery-6.jpg" alt="Gallery 6">
        <img src="./gallery-7.jpg" alt="Gallery 7">
    </div>

</body>
</html>
